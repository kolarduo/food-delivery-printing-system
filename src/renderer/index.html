<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rocket外卖打印工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Rocket外卖打印工具</h1>
      <p id="status">点击刷新订单开始读取 Rocket 订单</p>
    </div>
    <button id="refresh">刷新订单</button>
  </header>

  <main>
    <section class="toolbar" aria-label="订单筛选">
      <label class="filterBlock">
        <span>日期</span>
        <input id="date" type="date">
      </label>

      <div class="filterBlock">
        <span>店铺</span>
        <div class="storeFilter">
          <button id="storeToggle" class="storeToggle" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="storeSummary">川崎店</span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <div id="storeMenu" class="storeMenu" hidden>
            <label class="storeChoice storeAllChoice">
              <input id="storeAll" type="checkbox" checked>
              <span>全店铺</span>
            </label>
            <div id="storeOptions"></div>
            <p id="storeEmpty">默认筛选川崎店，读取订单后可切换其它店铺</p>
          </div>
        </div>
      </div>
    </section>

    <section class="summary">
      <div><span>筛选后订单</span><strong id="count">0</strong></div>
      <div><span>最后读取</span><strong id="last">尚未读取</strong></div>
    </section>

    <section class="tableWrap">
      <table>
        <thead><tr><th>订单号</th><th>下单时间</th><th>状态</th><th>主要商品</th><th>金额</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty">尚未读取订单。点击右上角“刷新订单”开始读取。</div>
    </section>
      <div id="appMeta" class="appMeta">Version 0.2.2  |  Developer: Wang Chengtao</div>
  </main>

  <dialog id="details">
    <div class="dialogHead">
      <h2>商品详情</h2>
      <div class="dialogActions">
        <button id="print" type="button">打印</button>
        <button id="close" type="button">关闭</button>
      </div>
    </div>
    <div id="detailList"></div>
  </dialog>
  <section id="printArea" aria-hidden="true"></section>
  <div id="loadingOverlay" class="loadingOverlay" hidden>
    <div class="loadingBox" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <strong>正在查询订单</strong>
      <span>Rocket Manager 已在后台读取，请稍等…</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
